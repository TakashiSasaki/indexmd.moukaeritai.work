<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" height="100%">
  <rect width="600" height="250" fill="#f8fafc" rx="8"/>
  <rect x="20" y="20" width="560" height="210" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="6"/>
  
  <!-- Left accent bar -->
  <path d="M 20 26 L 30 26 L 30 224 L 20 224 Z" fill="#6366f1"/>
  
  <!-- Ticket Title / Header -->
  <text x="50" y="60" font-family="sans-serif" font-size="24" font-weight="bold" fill="#0f172a">ANNUAL BUILD SUMMIT 2026</text>
  <text x="50" y="85" font-family="sans-serif" font-size="14" fill="#4f46e5" font-weight="bold">ADMIT ONE - VIP ALL ACCESS</text>
  
  <!-- Details -->
  <g transform="translate(50, 120)">
    <text x="0" y="20" font-family="sans-serif" font-size="11" fill="#64748b" font-weight="bold">DATE</text>
    <text x="0" y="40" font-family="sans-serif" font-size="14" fill="#0f172a" font-weight="bold">July 7, 2026</text>
    
