    <text x="300" y="40" font-family="sans-serif" font-size="14" fill="#0f172a" font-weight="bold">Row A, Seat 16</text>
  </g>
  
  <!-- Divider -->
  <line x1="460" y1="20" x2="460" y2="230" stroke="#cbd5e1" stroke-dasharray="4"/>
  
  <!-- Barcode on the right side -->
  <g transform="translate(485, 40)">
    <!-- Simulated Barcode lines -->
    <rect x="0" y="0" width="4" height="120" fill="#0f172a"/>
    <rect x="8" y="0" width="2" height="120" fill="#0f172a"/>
    <rect x="14" y="0" width="8" height="120" fill="#0f172a"/>
    <rect x="26" y="0" width="2" height="120" fill="#0f172a"/>
    <rect x="32" y="0" width="4" height="120" fill="#0f172a"/>
    <rect x="40" y="0" width="6" height="120" fill="#0f172a"/>
    <rect x="50" y="0" width="2" height="120" fill="#0f172a"/>
    <rect x="56" y="0" width="8" height="120" fill="#0f172a"/>
    <rect x="68" y="0" width="4" height="120" fill="#0f172a"/>
    
    <text x="37" y="145" font-family="monospace" font-size="10" fill="#475569" text-anchor="middle">*BUILD2026*</text>
