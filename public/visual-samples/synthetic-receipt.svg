<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <rect width="400" height="600" fill="#f8fafc" rx="8"/>
  <rect x="20" y="20" width="360" height="560" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="4"/>
  
  <!-- Logo -->
  <circle cx="200" cy="80" r="30" fill="#4f46e5"/>
  <text x="200" y="88" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">M</text>
  
  <text x="200" y="140" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">MOUKAERITAI CORP</text>
  <text x="200" y="160" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">123 Innovation Way, Tokyo, JP</text>
  
  <line x1="40" y1="190" x2="360" y2="190" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Line Items -->
  <text x="40" y="230" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Premium Indexing Subscription</text>
  <text x="360" y="230" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="end">$49.00</text>
  <text x="40" y="250" font-family="sans-serif" font-size="12" fill="#64748b">1 Month - Developer Plan</text>
  
  <text x="40" y="290" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Cloud Firestore Sync Fee</text>
  <text x="360" y="290" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="end">$5.00</text>
  <text x="40" y="310" font-family="sans-serif" font-size="12" fill="#64748b">50,000 extra writes</text>

  <line x1="40" y1="350" x2="360" y2="350" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Totals -->
  <text x="40" y="390" font-family="sans-serif" font-size="14" fill="#475569">Subtotal</text>
  <text x="360" y="390" font-family="sans-serif" font-size="14" fill="#475569" text-anchor="end">$54.00</text>
  
  <text x="40" y="420" font-family="sans-serif" font-size="14" fill="#475569">Tax (10%)</text>
  <text x="360" y="420" font-family="sans-serif" font-size="14" fill="#475569" text-anchor="end">$5.40</text>
  
  <line x1="40" y1="450" x2="360" y2="450" stroke="#cbd5e1" stroke-width="1"/>
  
  <text x="40" y="490" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a">TOTAL</text>
  <text x="360" y="490" font-family="sans-serif" font-size="20" font-weight="bold" fill="#4f46e5" text-anchor="end">$59.40</text>

  <!-- Footer -->
  <text x="200" y="550" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Thank you for your business!</text>
</svg>
